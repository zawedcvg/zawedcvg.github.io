baseURL: "https://pascalmichaillat.org/hugo-website/" 
title: Neeladri Bhuiya
theme: PaperMod

enableInlineShortcodes: true
enableRobotsTXT: true
pagination:
  pagerSize: 20

taxonomies:
    tag: tags

outputs:
  home:
    - HTML
    - RSS
    - JSON # necessary for search

menu:
    main:
        - name: Papers
          url: papers/
          weight: 2
        # - name: Projects
        #   url: projects/
        #   weight: 3
        - name: Experience
          url: experience/
          weight: 3
        - name: Search
          url: search/
          weight: 3


params:
    description: "This website hosts Neeladri Bhuiya's research papers, curriculum vitae, projects, and contact information."
    author: Neeladri Bhuiya
    # googleAnalyticsID: "G-XXXXX"
    DateFormat: "January 2006"
    defaultTheme: light
    hideFooter: false
    disableThemeToggle: true
    ShowShareButtons: false
    ShowReadingTime: false
    disableSpecial1stPost: true
    disableAnchoredHeadings: true
    ShowPostNavLinks: false
    ShowBreadCrumbs: false
    ShowCodeCopyButtons: true
    ShowAllPagesInArchive: false
    MainSections: ["papers","projects"]
    ShowToc: false
    disableScrollToTop: true
    TocOpen: true
    ShowWordCount: false
    UseHugoToc: true
    comments: false
    math: true
    profileMode:
          enabled: true
          title: Neeladri Bhuiya
          # subtitle: "I am a masters student "
          imageUrl: "picture.jpeg"
          imageWidth: 200
          imageHeight: 200
          # buttons:
          #   - name: Papers
          #     url: papers/
            # - name: Projects
            #   url: projects/
            # - name: Experience
            #   url: experience/

    socialIcons:
        - name: CV
          url: cv.pdf
        - name: Email
          url: mailto:nbhuiya@umass.edu
        - name: Google Scholar
          url: https://scholar.google.com/citations?hl=en&user=vIXRVtYAAAAJ
        - name: GitHub
          url: https://github.com/zawedcvg
        # - name: Twitter
        #   url: https://x.com/zawedcvg

    assets:
        disableScrollBarStyle: true
    cover:
        hiddenInList: false
        hiddenInSingle: true
    label:
      text: "Home"
      iconHeight: 18

markup:
    goldmark:
        renderer:
            unsafe: true
    highlight:
        guessSyntax: true
        style: autumn 
    tableOfContents:
        endLevel: 2
        ordered: false
        startLevel: 2
